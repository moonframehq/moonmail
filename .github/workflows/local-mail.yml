name: Local mail protocol tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - name: Daemon and real-adapter tests, no external mail service
        run: cargo test --locked -p moonmail-test-maild -p moonmail-network

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Client build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - name: Build fixture image
        run: docker build -f docker/test-maild.Dockerfile -t moonmail-test-maild:ci .
      - name: Test both TLS modes against the image
        run: python3 scripts/test_maild_docker.py moonmail-test-maild:ci
