name: Gmail live round trip

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: gmail-live
  cancel-in-progress: false

jobs:
  round-trip:
    # Secrets only reach code on the default branch. Scheduled runs are opt-in.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.GMAIL_LIVE_ENABLED == 'true')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install repository-pinned Rust
        run: rustup show active-toolchain
      - name: Compile live test without credentials
        run: cargo test --locked -p moonmail-network --test gmail_live --no-run
      - name: Send A to B, reply B to A, and verify Sent
        timeout-minutes: 12
        env:
          MOONMAIL_LIVE_GMAIL: '1'
          GMAIL_TEST_A_EMAIL: ${{ secrets.GMAIL_TEST_A_EMAIL }}
          GMAIL_TEST_A_APP_PASSWORD: ${{ secrets.GMAIL_TEST_A_APP_PASSWORD }}
          GMAIL_TEST_B_EMAIL: ${{ secrets.GMAIL_TEST_B_EMAIL }}
          GMAIL_TEST_B_APP_PASSWORD: ${{ secrets.GMAIL_TEST_B_APP_PASSWORD }}
        run: cargo test --locked -p moonmail-network --test gmail_live gmail_round_trip -- --ignored --exact --nocapture
